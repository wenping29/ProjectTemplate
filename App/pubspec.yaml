name: app
description: 移动端 App 模板 (Flutter)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0              # HTTP 请求
  provider: ^6.1.2         # 状态管理
  shared_preferences: ^2.3.2 # 本地存储（多账号 / token）
  image_picker: ^1.1.2     # 上传头像
  cached_network_image: ^3.4.1 # 头像展示

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 本地打包中文字体（Noto Sans SC，OFL 开源协议）。
  # 关键：覆盖 Roboto 家族后，Flutter Web (CanvasKit) 不再从
  # fonts.gstatic.com 联网下载 Roboto/NotoSansSC —— 解决国内
  # 网络下 Web 版文字渲染空白的问题；原生端不受影响。
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
