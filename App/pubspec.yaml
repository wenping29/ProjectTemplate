name: app
description: 移动端 App 模板 (Flutter)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0              # HTTP 请求
  provider: ^6.1.2         # 状态管理
  shared_preferences: ^2.3.2 # 本地存储（多账号 / token）
  image_picker: ^1.1.2     # 上传头像
  cached_network_image: ^3.4.1 # 头像展示

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
